<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="darkreader-lock">

    <meta
        name="color-scheme"
        content="light">

    <meta
        name="supported-color-schemes"
        content="light">

    <meta
        name="theme-color"
        content="#082b26">

    <style>
        :root,
        html {
            color-scheme: only light !important;
            background-color: #082b26 !important;
        }
    </style>

    <script>
        document.documentElement.style.colorScheme =
            "only light";
    </script>

    <title>Bappo – Tipp</title>

    <link
        rel="stylesheet"
        href="./style.css?v=80">
    <link rel="stylesheet" href="./game-theme.css?v=80">
    <link rel="stylesheet" href="./table-layout.css?v=80">
    <style>
        /* Nur im Solomodus: Die Karten bleiben vor der Tippabgabe sichtbar. */
        body.solo-mode.tip-page { overflow-y:auto !important; height:auto !important; min-height:100dvh !important; }
        body.solo-mode.tip-page .container { min-height:calc(100dvh - 56px); grid-template-rows:auto auto auto auto !important; overflow:visible !important; }
        body.solo-mode.tip-page .hand-panel { grid-column:1/-1 !important; grid-row:2 !important; align-self:stretch !important; min-height:110px; }
        body.solo-mode.tip-page #tipPanel { grid-column:1/-1 !important; grid-row:3 !important; align-self:center; }
        body.solo-mode.tip-page .container > .panel:last-child { grid-column:1/-1 !important; grid-row:4 !important; }
        body.solo-mode.tip-page #handArea { min-height:95px; }
    </style>
</head>

<body class="tip-page">
    <script>if(new URLSearchParams(location.search).has("solo"))document.body.classList.add("solo-mode");</script>

    <header class="game-brand"><span class="brand-mark" aria-hidden="true">✦</span><div><h1>BAPPO</h1><span class="brand-caption">DEIN TISCH. DEIN SPIEL.</span></div></header>

    <main class="container">

        <p
            class="page-error"
            id="pageError"
            hidden>
        </p>

        <section class="panel tip-heading">
            <h2 id="roundTitle">
                Runde wird geladen …
            </h2>

            <p id="playerDisplay"></p>

            <p
                class="current-tip-player"
                id="currentTipPlayer">
            </p>
        </section>

        <section
            class="panel"
            id="tipPanel">

            <h2>Wie viele Stiche schaffst du?</h2>

            <label for="tipInput">
                Dein Tipp
            </label>

            <input
                id="tipInput"
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                value="0">

            <button
                id="submitTipButton"
                type="button">
                Tipp verbindlich speichern
            </button>

            <p id="tipStatus"></p>

        </section>

        <section class="panel hand-panel">
            <h2>Deine Karten</h2>

            <div
                class="cards-grid"
                id="handArea">

                <p>
                    Handkarten werden geladen …
                </p>

            </div>
        </section>

        <section class="panel">
            <h2>Tipp-Reihenfolge</h2>

            <div id="tipOverview"></div>
        </section>

    </main>

    <script type="module">
        import(new URLSearchParams(location.search).has("solo") ? "./bot.js?v=83" : "./tip.js?v=80")
            .catch(error => {
                console.error(error);

                const errorElement =
                    document.getElementById(
                        "pageError"
                    );

                errorElement.hidden = false;
                errorElement.textContent =
                    "Tippseite konnte nicht geladen werden: " +
                    error.message;
            });
    </script>

    <script type="module" src="./table-ui.js?v=80"></script>
</body>
</html>
